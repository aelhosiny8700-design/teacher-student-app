name: teacher_student_app
description: "تطبيق المدرسين لرفع الملفات والفيديوهات والاختبارات والتواصل مع الطلبة"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

  # UI & Helpers
  google_fonts: ^6.1.0
  provider: ^6.1.1
  intl: ^0.19.0
  cached_network_image: ^3.3.0
  uuid: ^4.2.2
  badges: ^3.1.2

  # Uploads, Files & Sharing
  http: ^1.2.2
  file_picker: ^8.1.6
  image_picker: ^1.0.5
  url_launcher: ^6.3.0
  screenshot: ^3.0.0
  path_provider: ^2.1.2
  share_plus: ^7.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
